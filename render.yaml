# Render Blueprint: describes the web service so the setup is repeatable.
# Secret values are never stored here; Render asks for them in its dashboard (sync: false).
services:
  - type: web
    name: art-vault
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers lets the app see that visitors use https, so login cookies are marked secure.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
