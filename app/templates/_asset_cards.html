<div class="grid three">
  {% for a in assets %}
  <article class="card asset">
    <img class="asset-img" src="{{ url_for('static', path=a.preview_image_url) }}" alt="Children doing the {{ a.title }} activity" loading="lazy" decoding="async">
    <span class="badge badge-{{ a.tier_required }}">{{ a.tier_required|capitalize }}</span>
    <h3><a class="stretched" href="/assets/{{ a.id }}">{{ a.title }}</a></h3>
    <p class="muted">Ages {{ a.age_min }}–{{ a.age_max }} · {{ a.materials }}</p>
  </article>
  {% endfor %}
</div>
